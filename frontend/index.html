<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0d12" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="treinolog — registre treinos, séries e cargas e acompanhe sua evolução."
    />
    <title>treinolog</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icon.svg" />
    <script>
      // Register service worker for PWA offline support
      if ("serviceWorker" in navigator && window.location.protocol === "https:") {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").then((registration) => {
            console.log("SW registered: ", registration);
          }).catch((err) => {
            console.warn("SW registration failed: ", err);
          });
        });
      }
    </script>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#/" aria-label="treinolog — início">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M6.5 6.5v11" />
              <path d="M3.5 9v6" />
              <path d="M17.5 6.5v11" />
              <path d="M20.5 9v6" />
              <path d="M6.5 12h11" />
            </svg>
          </span>
          <span>treinolog</span>
        </a>
        <div class="topbar-actions">
          <span id="pending-indicator" class="pending-indicator" hidden></span>
          <button
            type="button"
            class="icon-btn"
            id="open-settings"
            aria-label="Configurações"
            title="Configurações"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.98 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.98a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.02 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.2.62.79 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z" />
            </svg>
          </button>
        </div>
      </header>

      <main id="app" class="page" aria-live="polite"></main>

      <nav class="tabbar" aria-label="Navegação principal">
        <a href="#/" data-nav="/" class="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5 12 3l9 7.5" />
            <path d="M5 9.5V21h14V9.5" />
          </svg>
          <span>Início</span>
        </a>
        <a href="#/historico" data-nav="/historico" class="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 2.6-6.3L3 8" />
            <path d="M3 3v5h5" />
          </svg>
          <span>Histórico</span>
        </a>
        <a href="#/novo" class="tab tab-primary" aria-label="Registrar novo treino">
          <span class="fab" aria-hidden="true">+</span>
        </a>
        <a href="#/progresso" data-nav="/progresso" class="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 20h18" />
            <path d="M6 20v-6" />
            <path d="M11 20V8" />
            <path d="M16 20v-9" />
            <path d="M21 20V4" />
          </svg>
          <span>Progresso</span>
        </a>
        <a href="#/exercicios" data-nav="/exercicios" class="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.5 6.5v11" />
            <path d="M3.5 9v6" />
            <path d="M17.5 6.5v11" />
            <path d="M20.5 9v6" />
            <path d="M6.5 12h11" />
          </svg>
          <span>Exercícios</span>
        </a>
      </nav>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>

    <script src="js/vendor/chart.umd.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
